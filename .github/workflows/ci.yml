name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "27"
  GOOGLE_JAVA_FORMAT_VERSION: "2.0.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          check_name: Test report
          require_tests: true

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download google-java-format
        run: >-
          curl -fsSL -o "$RUNNER_TEMP/google-java-format.jar"
          "https://repo1.maven.org/maven2/com/google/googlejavaformat/google-java-format/${GOOGLE_JAVA_FORMAT_VERSION}/google-java-format-${GOOGLE_JAVA_FORMAT_VERSION}-all-deps.jar"

      - name: Check google-java-format
        run: >-
          git ls-files -z '*.java'
          | xargs -0 java -jar "$RUNNER_TEMP/google-java-format.jar" --dry-run --set-exit-if-changed

  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Submit Maven dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6
